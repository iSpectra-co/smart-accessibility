name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dist file exists
        run: test -f dist/awidget.js

      - name: Check file size (warn if > 200 KB)
        run: |
          SIZE=$(wc -c < dist/awidget.js)
          echo "dist/awidget.js: ${SIZE} bytes"
          if [ "$SIZE" -gt 204800 ]; then
            echo "Warning: file exceeds 200 KB"
          fi

      - name: Lint JavaScript (basic syntax check)
        run: node --check dist/awidget.js
